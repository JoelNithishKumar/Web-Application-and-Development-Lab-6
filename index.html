<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Sunset Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="container">
        <h1>🌞 Sunrise & Sunset Dashboard</h1>

        <div class="controls">
            <label for="locationSelect">Select Location:</label>
            <select id="locationSelect">
                <option disabled selected value="">-- Choose a location --</option>
            </select>
            <button id="useCurrentLocation">📍 Use My Location</button>
        </div>

        <div id="dashboardToday" class="dashboard"></div>
        <div id="dashboardTomorrow" class="dashboard"></div>

        <footer>
            <p>Data courtesy of <a href="https://sunrisesunset.io/api/" target="_blank">SunriseSunset.io API</a></p>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
